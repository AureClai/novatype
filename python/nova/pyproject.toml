[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-typst"
version = "0.1.0"
description = "Python figure generation for NovaType/Typst documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "NovaType Contributors" }
]
keywords = ["typst", "novatype", "figures", "matplotlib", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
full = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "seaborn>=0.12.0",
    "plotly>=5.0.0",
    "scipy>=1.7.0",
]

[project.urls]
Homepage = "https://aureclai.github.io/novatype"
Repository = "https://github.com/AureClai/novatype"
Documentation = "https://aureclai.github.io/novatype/python"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
