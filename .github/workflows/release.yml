name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build binaries for all platforms
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nova
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: nova
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nova.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nova
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nova

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p nova-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf nova-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          mv nova-${{ matrix.target }}.tar.gz ../../../

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a nova-${{ matrix.target }}.zip ${{ matrix.artifact }}
          mv nova-${{ matrix.target }}.zip ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.target }}
          path: nova-${{ matrix.target }}.*

  # Build WASM package
  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build nova-wasm --target web --release

      - name: Package WASM
        run: |
          cd nova-wasm/pkg
          tar -czvf ../../nova-wasm.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-wasm
          path: nova-wasm.tar.gz

  # Create GitHub release
  release:
    name: Create Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Publish crates
        run: |
          # Publish in dependency order
          cargo publish -p nova-schema --token ${{ secrets.CARGO_TOKEN }}
          sleep 30
          cargo publish -p nova-cite --token ${{ secrets.CARGO_TOKEN }}
          sleep 30
          cargo publish -p nova-plot --token ${{ secrets.CARGO_TOKEN }}
          sleep 30
          cargo publish -p nova-core --token ${{ secrets.CARGO_TOKEN }}
          sleep 30
          cargo publish -p nova-cli --token ${{ secrets.CARGO_TOKEN }}
