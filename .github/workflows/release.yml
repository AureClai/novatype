name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build binaries for all platforms
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nova
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: nova
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nova.exe
            use_cross: false
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: nova
            use_cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: nova
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binary (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p novatype-cli

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p novatype-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf nova-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          mv nova-${{ matrix.target }}.tar.gz ../../../

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a nova-${{ matrix.target }}.zip ${{ matrix.artifact }}
          mv nova-${{ matrix.target }}.zip ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.target }}
          path: nova-${{ matrix.target }}.*

  # Build WASM package
  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build crates/nova-wasm --target web --release

      - name: Package WASM
        run: |
          cd crates/nova-wasm/pkg
          tar -czvf ../../../novatype-wasm.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novatype-wasm
          path: novatype-wasm.tar.gz

  # Create GitHub release
  release:
    name: Create Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish in dependency order
          cargo publish -p nova-schema || true
          sleep 30
          cargo publish -p nova-cite || true
          sleep 30
          cargo publish -p nova-plot || true
          sleep 30
          cargo publish -p novatype-core || true
          sleep 30
          cargo publish -p novatype-cli || true

  # Publish WASM to npm
  publish-npm:
    name: Publish to npm
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build WASM for npm
        run: wasm-pack build crates/nova-wasm --target web --release

      - name: Update package.json
        run: |
          cd crates/nova-wasm/pkg
          # Update package name and add keywords
          cat > package.json << 'EOF'
          {
            "name": "novatype-wasm",
            "version": "${{ github.ref_name }}",
            "type": "module",
            "description": "WebAssembly build of NovaType for browser-based document compilation",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/AureClai/novatype"
            },
            "files": [
              "nova_wasm_bg.wasm",
              "nova_wasm.js",
              "nova_wasm.d.ts",
              "nova_wasm_bg.wasm.d.ts"
            ],
            "main": "nova_wasm.js",
            "types": "nova_wasm.d.ts",
            "homepage": "https://aureclai.github.io/novatype",
            "keywords": [
              "typst",
              "novatype",
              "wasm",
              "webassembly",
              "document",
              "typesetting",
              "pdf",
              "latex-alternative"
            ]
          }
          EOF
          # Fix version (remove 'v' prefix)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/\${{ github.ref_name }}/$VERSION/" package.json

      - name: Publish to npm
        run: |
          cd crates/nova-wasm/pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
