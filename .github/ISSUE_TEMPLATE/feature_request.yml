name: Feature Request
description: Suggest a new feature or enhancement for NovaType
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please provide as much context as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: "I would like NovaType to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: "I've also considered..."

  - type: textarea
    id: example
    attributes:
      label: Example Usage
      description: If applicable, show how this feature would be used.
      render: typ
      placeholder: |
        // Example of how this feature would work
        #new-feature(
          option: "value"
        )

  - type: dropdown
    id: crate
    attributes:
      label: Affected Crate
      description: Which crate would this feature affect?
      options:
        - nova-cli
        - nova-core
        - nova-cite
        - nova-plot
        - nova-schema
        - nova-wasm
        - New crate
        - Unknown / Multiple
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Important
        - Critical for my use case

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature
        - label: I have searched existing issues to ensure this hasn't been requested
          required: true
