<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Playground NovaType - Editeur interactif avec rendu temps reel via WebAssembly.">
  <title>Playground - NovaType</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/novatype/assets/css/style.css">
  <style>
    :root {
      --navbar-height: 80px;
      --controls-height: 48px;
    }

    body {
      overflow: hidden;
    }

    /* Controls bar under navbar */
    .playground-controls {
      position: fixed;
      top: var(--navbar-height);
      left: 0;
      right: 0;
      height: var(--controls-height);
      background: var(--nova-darker);
      border-bottom: 1px solid var(--nova-dark);
      display: flex;
      align-items: center;
      padding: 0 var(--space-lg);
      gap: var(--space-lg);
      z-index: 90;
    }

    .controls-section {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .controls-label {
      font-size: 0.75rem;
      color: var(--nova-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Dropdown */
    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 6px var(--space-md);
      background: var(--nova-dark);
      border: 1px solid var(--nova-secondary);
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 180px;
    }

    .dropdown-btn:hover {
      background: var(--nova-secondary);
      border-color: var(--nova-light);
    }

    .dropdown-btn svg {
      margin-left: auto;
      transition: transform 0.2s;
    }

    .dropdown.open .dropdown-btn svg {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 280px;
      background: var(--nova-darker);
      border: 1px solid var(--nova-dark);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s;
      z-index: 200;
      max-height: 70vh;
      overflow-y: auto;
    }

    .dropdown.open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      display: block;
      padding: var(--space-sm) var(--space-md);
      color: var(--nova-light);
      text-decoration: none;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .dropdown-item:hover {
      background: var(--nova-dark);
      color: white;
    }

    .dropdown-item.active {
      background: var(--nova-primary);
      color: white;
    }

    .dropdown-item-title {
      font-weight: 500;
    }

    .dropdown-item-desc {
      font-size: 0.75rem;
      color: var(--nova-secondary);
      margin-top: 2px;
    }

    .dropdown-item:hover .dropdown-item-desc {
      color: var(--nova-light);
    }

    .dropdown-item.active .dropdown-item-desc {
      color: rgba(255,255,255,0.8);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--nova-dark);
      margin: var(--space-xs) 0;
    }

    .dropdown-header {
      padding: var(--space-sm) var(--space-md);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--nova-secondary);
      font-weight: 600;
    }

    /* Status */
    .controls-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 0.8rem;
      color: var(--nova-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--nova-secondary);
    }

    .status-dot.loading {
      background: var(--nova-primary);
      animation: pulse 1s infinite;
    }

    .status-dot.ready {
      background: var(--nova-accent);
    }

    .status-dot.error {
      background: #ef4444;
    }

    .status-dot.compiling {
      background: #f59e0b;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main Layout */
    .playground-container {
      display: flex;
      height: calc(100vh - var(--navbar-height) - var(--controls-height));
      margin-top: calc(var(--navbar-height) + var(--controls-height));
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--nova-darker);
      border-right: 1px solid var(--nova-dark);
      min-width: 0;
    }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      min-width: 0;
    }

    /* Pane Headers */
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--nova-dark);
      flex-shrink: 0;
    }

    .editor-pane .pane-header {
      background: rgba(0,0,0,0.2);
    }

    .preview-pane .pane-header {
      background: var(--nova-lighter);
      border-bottom-color: var(--nova-light);
    }

    .pane-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .editor-pane .pane-title {
      color: var(--nova-secondary);
    }

    .preview-pane .pane-title {
      color: var(--nova-dark);
    }

    /* Example Description */
    .example-description {
      padding: var(--space-sm) var(--space-md);
      background: linear-gradient(135deg, var(--nova-primary), #7c3aed);
      color: white;
      font-size: 0.85rem;
      display: none;
    }

    .example-description.visible {
      display: block;
    }

    .example-description-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .example-description-text {
      opacity: 0.9;
      font-size: 0.8rem;
    }

    /* Editor */
    .editor-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #editor {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--nova-light);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      padding: var(--space-md);
      resize: none;
      outline: none;
      tab-size: 2;
    }

    #editor::placeholder {
      color: var(--nova-secondary);
    }

    /* Preview */
    .preview-content {
      flex: 1;
      overflow: auto;
      padding: var(--space-lg);
      background: #e2e8f0;
    }

    .preview-result {
      min-height: 100%;
    }

    .preview-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--nova-secondary);
    }

    .preview-loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--nova-light);
      border-top-color: var(--nova-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: var(--space-md);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .preview-document {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      padding-bottom: var(--space-xl);
    }

    .preview-page {
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
    }

    .preview-page svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .preview-page-number {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Clickable references in SVG */
    .preview-page svg a {
      cursor: pointer !important;
    }

    .preview-page svg a:hover {
      opacity: 0.7;
    }

    .preview-page svg a text,
    .preview-page svg a use,
    .preview-page svg a path {
      cursor: pointer !important;
    }

    /* Highlight animation for targets */
    .ref-highlight {
      animation: refHighlight 2s ease-out;
    }

    @keyframes refHighlight {
      0%, 20% {
        outline: 3px solid #2563eb;
        outline-offset: 4px;
        background: rgba(37, 99, 235, 0.1);
      }
      100% {
        outline: 3px solid transparent;
        outline-offset: 4px;
        background: transparent;
      }
    }

    .preview-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      color: #b91c1c;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-width: 600px;
      display: none;
    }

    .preview-error.visible {
      display: block;
    }

    /* Resizer */
    .resizer {
      width: 6px;
      background: var(--nova-dark);
      cursor: col-resize;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .resizer:hover,
    .resizer.dragging {
      background: var(--nova-primary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .playground-container {
        flex-direction: column;
      }

      .editor-pane {
        border-right: none;
        border-bottom: 1px solid var(--nova-dark);
        height: 45%;
      }

      .preview-pane {
        height: 55%;
      }

      .resizer {
        display: none;
      }

      .controls-label {
        display: none;
      }

      .dropdown-btn {
        min-width: 140px;
      }
    }
  </style>
</head>

    let compilerReady = false;
    let compileTimer = null;
    let lastSource = null;
    let currentExampleKey = 'hello';

    // DOM elements
    const editor = document.getElementById('editor');
    const previewLoading = document.getElementById('previewLoading');
    const previewResult = document.getElementById('previewResult');
    const previewError = document.getElementById('previewError');
    const statusDot = document.getElementById('statusDot');

    const examplesDropdown = document.getElementById('examplesDropdown');
    const examplesBtn = document.getElementById('examplesBtn');
    const currentExampleSpan = document.getElementById('currentExample');
    const exampleDescription = document.getElementById('exampleDescription');

    const editorPane = document.getElementById('editorPane');
    const previewPane = document.getElementById('previewPane');
    const resizer = document.getElementById('resizer');

    // Load example
    function loadExample(key) {
      const example = examples[key];
      if (!example) return;

      currentExampleKey = key;
      editor.value = example.code;
      currentExampleSpan.textContent = example.title;

      // Update description
      exampleTitle.textContent = example.title;
      exampleText.textContent = example.description;
      exampleDescription.classList.add('visible');

      // Update active state in dropdown
      document.querySelectorAll('.dropdown-item').forEach(item => {
        item.classList.toggle('active', item.dataset.example === key);
      });

      // Close dropdown
      examplesDropdown.classList.remove('open');

      // Trigger compile
      if (compilerReady) {
        doCompile(example.code);
      }
    }

    // Make references clickable in SVG
    function makeReferencesClickable(container) {
      const pages = container.querySelectorAll('.preview-page');

      pages.forEach((page, pageIndex) => {
        const svg = page.querySelector('svg');
        if (!svg) return;

        // Add page index as data attribute for cross-page navigation
        page.dataset.pageIndex = pageIndex;

        // Find all links in the SVG (Typst generates <a> elements with href or xlink:href)
        const links = svg.querySelectorAll('a');

        links.forEach(link => {
          // Get href from either href or xlink:href
          let href = link.getAttribute('href') || link.getAttributeNS('http://www.w3.org/1999/xlink', 'href');

          if (!href) return;

          // Style the link
          link.style.cursor = 'pointer';

          // Handle internal references (start with #)
          if (href.startsWith('#')) {
            link.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();

              const targetId = href.substring(1); // Remove #

              // Find the target element across all pages
              // Typst uses IDs like the label name
              let targetElement = null;
              let targetPage = null;

              pages.forEach((p, idx) => {
                const svgEl = p.querySelector('svg');
                if (!svgEl) return;

                // Try to find by ID
                let target = svgEl.getElementById(targetId);

                // Also try finding by data-label or similar attributes
                if (!target) {
                  target = svgEl.querySelector(`[id*="${targetId}"]`);
                }

                if (target) {
                  targetElement = target;
                  targetPage = p;
                }
              });

              if (targetPage) {
                // Scroll the page into view
                targetPage.scrollIntoView({ behavior: 'smooth', block: 'center' });

                // Add highlight effect
                targetPage.classList.add('ref-highlight');
                setTimeout(() => targetPage.classList.remove('ref-highlight'), 2000);
              } else {
                // Target not found - might be same page, just log
                console.log('Reference target not found:', targetId);
              }
            });
          }
        });

        // Also handle elements that look like references but aren't wrapped in <a>
        // (Sometimes Typst renders them as colored text groups)
        const groups = svg.querySelectorAll('g[fill]');
        groups.forEach(g => {
          const fill = g.getAttribute('fill');
          // Check if it's a link-colored element (typically blue)
          if (fill && (fill.includes('2563eb') || fill.includes('rgb(37, 99, 235)') || fill === '#0000ff' || fill.includes('blue'))) {
            g.style.cursor = 'pointer';
            g.addEventListener('mouseenter', () => g.style.opacity = '0.7');
            g.addEventListener('mouseleave', () => g.style.opacity = '1');
          }
        });
      });
    }

    // Compile function
    async function doCompile(source) {
      if (source === lastSource) return;
      lastSource = source;

      statusDot.className = 'status-dot compiling';
      statusText.textContent = 'Compilation...';

      try {
        const result = await compile(source);

        if (result.success && result.svg_pages.length > 0) {
          // Render all pages as a scrollable document
          const pagesHtml = result.svg_pages.map((svg, index) => `
            <div class="preview-page">
              ${svg}
              ${result.svg_pages.length > 1 ? `<span class="preview-page-number">${index + 1} / ${result.svg_pages.length}</span>` : ''}
            </div>
          `).join('');

          previewResult.innerHTML = `<div class="preview-document">${pagesHtml}</div>`;
          previewResult.style.display = 'block';
          previewError.classList.remove('visible');

          // Make references clickable
          makeReferencesClickable(previewResult);

          statusDot.className = 'status-dot ready';
          statusText.textContent = result.svg_pages.length > 1
            ? `Pret (${result.svg_pages.length} pages)`
            : 'Pret';
        } else {
          previewError.textContent = result.errors.join('\n');
          previewError.classList.add('visible');
          previewResult.style.display = 'none';

          statusDot.className = 'status-dot error';
          statusText.textContent = 'Erreur';
        }
      } catch (err) {
        previewError.textContent = err.message || String(err);
        previewError.classList.add('visible');
        previewResult.style.display = 'none';

        statusDot.className = 'status-dot error';
        statusText.textContent = 'Erreur';
      }
    }

    // Debounced compile
    function scheduleCompile() {
      if (compileTimer) clearTimeout(compileTimer);
      compileTimer = setTimeout(() => {
        if (compilerReady) {
          doCompile(editor.value);
        }
      }, 400);
    }

    // Load template from localStorage (from Templates page)
    function loadTemplateFromStorage() {
      const stored = localStorage.getItem('novatype_template');
      if (stored) {
        try {
          const template = JSON.parse(stored);
          // Clear storage so it doesn't reload on refresh
          localStorage.removeItem('novatype_template');

          // Load the template
          editor.value = template.code;
          currentExampleSpan.textContent = template.name;

          // Update description
          exampleTitle.textContent = template.name;
          exampleText.textContent = template.description;
          exampleDescription.classList.add('visible');

          // Clear active state from dropdown items
          document.querySelectorAll('.dropdown-item').forEach(item => {
            item.classList.remove('active');
          });

          return true;
        } catch (e) {
          console.error('Failed to load template from storage:', e);
        }
      }
      return false;
    }

    // Initialize
    async function init() {
      // Check for template from Templates page first
      const hasStoredTemplate = loadTemplateFromStorage();

      // If no stored template, load default example
      if (!hasStoredTemplate) {
        loadExample('hello');
      }

      try {
        statusText.textContent = 'Chargement du compilateur...';

        await initNovaCompiler();

        compilerReady = true;
        previewLoading.style.display = 'none';

        statusDot.className = 'status-dot ready';
        statusText.textContent = 'Pret';

        // Initial compile
        doCompile(editor.value);

      } catch (error) {
        statusDot.className = 'status-dot error';
        statusText.textContent = 'Erreur de chargement';

        previewLoading.innerHTML = `
          <div style="color: #ef4444; text-align: center;">
            <p style="font-weight: 600;">Impossible de charger le compilateur</p>
            <p style="font-size: 0.85rem; margin-top: 8px;">${error.message}</p>
            <p style="font-size: 0.8rem; margin-top: 16px; color: var(--nova-secondary);">
              Essayez de recharger la page ou utilisez un navigateur moderne.
            </p>
          </div>
        `;
      }
    }

    // Event listeners

    // Editor input
    editor.addEventListener('input', scheduleCompile);

    // Tab key support
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        scheduleCompile();
      }
    });

    // Dropdown toggle
    examplesBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      examplesDropdown.classList.toggle('open');
    });

    // Close dropdown on outside click
    document.addEventListener('click', () => {
      examplesDropdown.classList.remove('open');
    });

    // Example selection
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        loadExample(item.dataset.example);
      });
    });

    // Resizer
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;

      const containerWidth = document.querySelector('.playground-container').offsetWidth;
      const newEditorWidth = e.clientX;
      const minWidth = 300;
      const maxWidth = containerWidth - 300;

      if (newEditorWidth >= minWidth && newEditorWidth <= maxWidth) {
        const editorPercent = (newEditorWidth / containerWidth) * 100;
        editorPane.style.flex = `0 0 ${editorPercent}%`;
        previewPane.style.flex = '1';
      }
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    // Start
    init();
  </script>
