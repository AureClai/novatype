<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Playground NovaType - Editeur interactif avec rendu temps reel via WebAssembly.">
  <title>Playground - NovaType</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root {
      --toolbar-height: 56px;
      --sidebar-width: 0px;
    }

    body {
      overflow: hidden;
    }

    /* Toolbar */
    .playground-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--toolbar-height);
      background: var(--nova-darker);
      border-bottom: 1px solid var(--nova-dark);
      display: flex;
      align-items: center;
      padding: 0 var(--space-lg);
      gap: var(--space-lg);
      z-index: 100;
    }

    .toolbar-logo {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .toolbar-logo svg {
      width: 28px;
      height: 28px;
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--nova-dark);
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .toolbar-label {
      font-size: 0.75rem;
      color: var(--nova-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Dropdown */
    .dropdown {
      position: relative;
    }

    .dropdown-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: var(--nova-dark);
      border: 1px solid var(--nova-secondary);
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 180px;
    }

    .dropdown-btn:hover {
      background: var(--nova-secondary);
      border-color: var(--nova-light);
    }

    .dropdown-btn svg {
      margin-left: auto;
      transition: transform 0.2s;
    }

    .dropdown.open .dropdown-btn svg {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 280px;
      background: var(--nova-darker);
      border: 1px solid var(--nova-dark);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s;
      z-index: 200;
      max-height: 400px;
      overflow-y: auto;
    }

    .dropdown.open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-item {
      display: block;
      padding: var(--space-sm) var(--space-md);
      color: var(--nova-light);
      text-decoration: none;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .dropdown-item:hover {
      background: var(--nova-dark);
      color: white;
    }

    .dropdown-item.active {
      background: var(--nova-primary);
      color: white;
    }

    .dropdown-item-title {
      font-weight: 500;
    }

    .dropdown-item-desc {
      font-size: 0.75rem;
      color: var(--nova-secondary);
      margin-top: 2px;
    }

    .dropdown-item:hover .dropdown-item-desc {
      color: var(--nova-light);
    }

    .dropdown-item.active .dropdown-item-desc {
      color: rgba(255,255,255,0.8);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--nova-dark);
      margin: var(--space-xs) 0;
    }

    .dropdown-header {
      padding: var(--space-sm) var(--space-md);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--nova-secondary);
      font-weight: 600;
    }

    /* Status */
    .toolbar-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 0.8rem;
      color: var(--nova-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--nova-secondary);
    }

    .status-dot.loading {
      background: var(--nova-primary);
      animation: pulse 1s infinite;
    }

    .status-dot.ready {
      background: var(--nova-accent);
    }

    .status-dot.error {
      background: #ef4444;
    }

    .status-dot.compiling {
      background: #f59e0b;
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main Layout */
    .playground-container {
      display: flex;
      height: calc(100vh - var(--toolbar-height));
      margin-top: var(--toolbar-height);
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--nova-darker);
      border-right: 1px solid var(--nova-dark);
      min-width: 0;
    }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      min-width: 0;
    }

    /* Pane Headers */
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--nova-dark);
      flex-shrink: 0;
    }

    .editor-pane .pane-header {
      background: rgba(0,0,0,0.2);
    }

    .preview-pane .pane-header {
      background: var(--nova-lighter);
      border-bottom-color: var(--nova-light);
    }

    .pane-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .editor-pane .pane-title {
      color: var(--nova-secondary);
    }

    .preview-pane .pane-title {
      color: var(--nova-dark);
    }

    /* Example Description */
    .example-description {
      padding: var(--space-sm) var(--space-md);
      background: linear-gradient(135deg, var(--nova-primary), #7c3aed);
      color: white;
      font-size: 0.85rem;
      display: none;
    }

    .example-description.visible {
      display: block;
    }

    .example-description-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .example-description-text {
      opacity: 0.9;
      font-size: 0.8rem;
    }

    /* Editor */
    .editor-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #editor {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--nova-light);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      padding: var(--space-md);
      resize: none;
      outline: none;
      tab-size: 2;
    }

    #editor::placeholder {
      color: var(--nova-secondary);
    }

    /* Preview */
    .preview-content {
      flex: 1;
      overflow: auto;
      padding: var(--space-lg);
      display: flex;
      justify-content: center;
      background: #f8fafc;
    }

    .preview-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--nova-secondary);
    }

    .preview-loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--nova-light);
      border-top-color: var(--nova-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: var(--space-md);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .preview-result {
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      border-radius: var(--radius-sm);
      overflow: hidden;
      max-width: 100%;
    }

    .preview-result svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .preview-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      color: #b91c1c;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-width: 600px;
      display: none;
    }

    .preview-error.visible {
      display: block;
    }

    /* Resizer */
    .resizer {
      width: 6px;
      background: var(--nova-dark);
      cursor: col-resize;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .resizer:hover,
    .resizer.dragging {
      background: var(--nova-primary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .playground-container {
        flex-direction: column;
      }

      .editor-pane {
        border-right: none;
        border-bottom: 1px solid var(--nova-dark);
        height: 45%;
      }

      .preview-pane {
        height: 55%;
      }

      .resizer {
        display: none;
      }

      .toolbar-label {
        display: none;
      }

      .dropdown-btn {
        min-width: 140px;
      }
    }
  </style>
</head>

    // State
    let compilerReady = false;
    let compileTimer = null;
    let lastSource = null;
    let currentExampleKey = 'hello';

    // DOM elements
    const editor = document.getElementById('editor');
    const previewLoading = document.getElementById('previewLoading');
    const previewResult = document.getElementById('previewResult');
    const previewError = document.getElementById('previewError');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const examplesDropdown = document.getElementById('examplesDropdown');
    const examplesBtn = document.getElementById('examplesBtn');
    const currentExampleSpan = document.getElementById('currentExample');
    const exampleDescription = document.getElementById('exampleDescription');
    const exampleTitle = document.getElementById('exampleTitle');
    const exampleText = document.getElementById('exampleText');
    const editorPane = document.getElementById('editorPane');
    const previewPane = document.getElementById('previewPane');
    const resizer = document.getElementById('resizer');

    // Load example
    function loadExample(key) {
      const example = examples[key];
      if (!example) return;

      currentExampleKey = key;
      editor.value = example.code;
      currentExampleSpan.textContent = example.title;

      // Update description
      exampleTitle.textContent = example.title;
      exampleText.textContent = example.description;
      exampleDescription.classList.add('visible');

      // Update active state in dropdown
      document.querySelectorAll('.dropdown-item').forEach(item => {
        item.classList.toggle('active', item.dataset.example === key);
      });

      // Close dropdown
      examplesDropdown.classList.remove('open');

      // Trigger compile
      if (compilerReady) {
        doCompile(example.code);
      }
    }

    // Compile function
    async function doCompile(source) {
      if (source === lastSource) return;
      lastSource = source;

      statusDot.className = 'status-dot compiling';
      statusText.textContent = 'Compilation...';

      try {
        const result = await compile(source);

        if (result.success && result.svg_pages.length > 0) {
          previewResult.innerHTML = result.svg_pages[0];
          previewResult.style.display = 'block';
          previewError.classList.remove('visible');

          // Scale SVG
          const svg = previewResult.querySelector('svg');
          if (svg) {
            svg.style.maxWidth = '100%';
            svg.style.height = 'auto';
          }

          statusDot.className = 'status-dot ready';
          statusText.textContent = 'Pret';
        } else {
          previewError.textContent = result.errors.join('\n');
          previewError.classList.add('visible');
          previewResult.style.display = 'none';

          statusDot.className = 'status-dot error';
          statusText.textContent = 'Erreur';
        }
      } catch (err) {
        previewError.textContent = err.message || String(err);
        previewError.classList.add('visible');
        previewResult.style.display = 'none';

        statusDot.className = 'status-dot error';
        statusText.textContent = 'Erreur';
      }
    }

    // Debounced compile
    function scheduleCompile() {
      if (compileTimer) clearTimeout(compileTimer);
      compileTimer = setTimeout(() => {
        if (compilerReady) {
          doCompile(editor.value);
        }
      }, 400);
    }

    // Initialize
    async function init() {
      // Load initial example
      loadExample('hello');

      try {
        statusText.textContent = 'Chargement du compilateur...';

        await initNovaCompiler();

        compilerReady = true;
        previewLoading.style.display = 'none';

        statusDot.className = 'status-dot ready';
        statusText.textContent = 'Pret';

        // Initial compile
        doCompile(editor.value);

      } catch (error) {
        statusDot.className = 'status-dot error';
        statusText.textContent = 'Erreur de chargement';

        previewLoading.innerHTML = `
          <div style="color: #ef4444; text-align: center;">
            <p style="font-weight: 600;">Impossible de charger le compilateur</p>
            <p style="font-size: 0.85rem; margin-top: 8px;">${error.message}</p>
            <p style="font-size: 0.8rem; margin-top: 16px; color: var(--nova-secondary);">
              Essayez de recharger la page ou utilisez un navigateur moderne.
            </p>
          </div>
        `;
      }
    }

    // Event listeners

    // Editor input
    editor.addEventListener('input', scheduleCompile);

    // Tab key support
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        scheduleCompile();
      }
    });

    // Dropdown toggle
    examplesBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      examplesDropdown.classList.toggle('open');
    });

    // Close dropdown on outside click
    document.addEventListener('click', () => {
      examplesDropdown.classList.remove('open');
    });

    // Example selection
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        loadExample(item.dataset.example);
      });
    });

    // Resizer
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;

      const containerWidth = document.querySelector('.playground-container').offsetWidth;
      const newEditorWidth = e.clientX;
      const minWidth = 300;
      const maxWidth = containerWidth - 300;

      if (newEditorWidth >= minWidth && newEditorWidth <= maxWidth) {
        const editorPercent = (newEditorWidth / containerWidth) * 100;
        editorPane.style.flex = `0 0 ${editorPercent}%`;
        previewPane.style.flex = '1';
      }
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    // Start
    init();
  </script>
