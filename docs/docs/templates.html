    .templates-hero {
      padding: 8rem 0 4rem;
      background: linear-gradient(135deg, var(--nova-darker) 0%, var(--nova-dark) 100%);
      color: white;
    }

    .templates-hero h1 {
      color: white;
      font-size: 2.5rem;
      margin-bottom: var(--space-md);
    }

    .templates-hero p {
      color: var(--nova-light);
      font-size: 1.125rem;
      max-width: 600px;
    }

    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: var(--space-xl);
      padding: var(--space-3xl) 0;
    }

    .template-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .template-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-xl);
    }

    .template-preview {
      background: #f1f5f9;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .template-preview-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      color: var(--nova-secondary);
    }

    .template-preview-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--nova-light);
      border-top-color: var(--nova-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .template-preview svg {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      background: white;
    }

    .template-preview-page {
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      max-height: 260px;
      overflow: hidden;
    }

    .template-preview-page svg {
      display: block;
      width: auto;
      height: 260px;
    }

    .template-info {
      padding: var(--space-lg);
    }

    .template-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .template-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }

    .template-icon svg {
      width: 24px;
      height: 24px;
    }

    .template-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--nova-darker);
      margin: 0;
    }

    .template-category {
      font-size: 0.75rem;
      color: var(--nova-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .template-description {
      color: var(--nova-gray);
      margin-bottom: var(--space-md);
      line-height: 1.6;
    }

    .template-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .template-tag {
      background: var(--nova-lighter);
      color: var(--nova-gray);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
    }

    .template-actions {
      display: flex;
      gap: var(--space-sm);
    }

    .template-actions .btn {
      flex: 1;
      justify-content: center;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.875rem;
    }

    /* Filter tabs */
    .templates-filter {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-top: var(--space-xl);
    }

    .filter-btn {
      padding: 8px 20px;
      border: 1px solid rgba(255,255,255,0.3);
      background: transparent;
      color: rgba(255,255,255,0.8);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
    }

    .filter-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
    }

    .filter-btn.active {
      background: white;
      color: var(--nova-darker);
      border-color: white;
    }

    @media (max-width: 768px) {
      .templates-grid {
        grid-template-columns: 1fr;
      }

      .templates-hero h1 {
        font-size: 2rem;
      }
    }
  </style>

#v(1em)

= Introduction

La redaction de documents scientifiques
necessite des outils capables de produire
une sortie de haute qualite typographique
tout en offrant une syntaxe accessible.
Historiquement, LaTeX a domine ce domaine
depuis les annees 1980.

Cependant, de nouveaux systemes comme Typst
proposent une approche moderne avec une
compilation incrementale et une syntaxe
simplifiee. Cette etude vise a comparer
objectivement ces differentes solutions.

== Contexte

Les systemes de composition typographique
ont evolue considerablement au cours des
dernieres decennies. Du simple traitement
de texte aux systemes de balisage avances,
les outils disponibles offrent aujourd'hui
des capacites remarquables.

== Objectifs

Notre etude poursuit trois objectifs principaux :
+ Evaluer les performances de compilation
+ Comparer la qualite typographique
+ Analyser l'experience utilisateur

= Methodologie

Notre approche experimentale repose sur
un protocole rigoureux et reproductible.

== Corpus de test

Nous avons constitue un corpus de 50 documents
representatifs couvrant differents domaines :
- Articles scientifiques (20 documents)
- Rapports techniques (15 documents)
- Theses et memoires (10 documents)
- Presentations (5 documents)

== Metriques

Les metriques suivantes ont ete mesurees
pour chaque systeme evalue :

#figure(
  table(
    columns: 3,
    table.header([*Metrique*], [*Unite*], [*Description*]),
    [Temps compilation], [secondes], [Duree totale],
    [Memoire], [Mo], [Pic d'utilisation],
    [Qualite], [score], [Evaluation experte],
  ),
  caption: [Metriques d'evaluation]
) <tab:metriques>

== Modele mathematique

La qualite globale $Q$ est calculee selon
l'equation suivante :

$ Q = sum_(i=1)^n w_i dot q_i $ <eq:qualite>

ou $w_i$ represente le poids de chaque critere
et $q_i$ le score obtenu pour ce critere.

= Resultats

Les resultats de notre evaluation sont
presentes dans cette section.

== Performances

Les temps de compilation moyens sont
presentes dans le @tab:resultats ci-dessous.

#figure(
  table(
    columns: 4,
    table.header([*Systeme*], [*Temps (s)*], [*Memoire (Mo)*], [*Score*]),
    [LaTeX], [4.2], [256], [8.5],
    [Typst], [0.3], [64], [8.8],
    [Word], [1.1], [512], [6.2],
  ),
  caption: [Resultats comparatifs]
) <tab:resultats>

Comme le montre l'@eq:qualite, le score
de qualite integre plusieurs dimensions.
Les resultats du @tab:resultats confirment
l'avantage des systemes modernes.

== Analyse statistique

L'analyse de variance (ANOVA) revele des
differences significatives entre les
systemes ($p < 0.001$). Le test post-hoc
de Tukey confirme que Typst surpasse
significativement les autres solutions
pour le critere de temps de compilation.

La distribution des scores suit une loi
normale, validant nos hypotheses :

$ f(x) = 1/(sigma sqrt(2 pi)) e^(-1/2 ((x-mu)/sigma)^2) $ <eq:normale>

== Discussion

Ces resultats suggerent que les systemes
modernes offrent un meilleur compromis
entre performance et qualite. Cependant,
la courbe d'apprentissage et l'ecosysteme
existant restent des facteurs importants.

= Conclusion

Cette etude demontre que les systemes de
composition modernes comme Typst offrent
des avantages significatifs en termes de
performance tout en maintenant une qualite
typographique comparable a LaTeX.

== Travaux futurs

Nous envisageons d'etendre cette analyse
aux aspects collaboratifs et a l'integration
avec les outils de gestion bibliographique.

== Remerciements

Les auteurs remercient le laboratoire XYZ
pour son soutien financier et technique.`

      report: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M15 3h4a2 2 0 012 2v10a2 2 0 01-2 2h-4"/><path d="M12 17v4M8 21h8"/></svg>',
      letter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>',
      cv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      presentation: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><path d="M8 21h8M12 17v4"/></svg>'
    };

    // State
    let compilerReady = false;
    let currentFilter = 'all';
    const previewCache = new Map();

    // DOM
    const grid = document.getElementById('templatesGrid');

    // Render template card
    function renderTemplateCard(template) {
      return `
        <div class="template-card" data-category="${template.category}" data-id="${template.id}">
          <div class="template-preview" id="preview-${template.id}">
            <div class="template-preview-loading">
              <div class="template-preview-spinner"></div>
              <span>Chargement...</span>
            </div>
          </div>
          <div class="template-info">
            <div class="template-header">
              <div class="template-icon" style="background: ${template.color}">
                ${icons[template.icon]}
              </div>
              <div>
                <h3 class="template-name">${template.name}</h3>
                <span class="template-category">${template.category}</span>
              </div>
            </div>
            <p class="template-description">${template.description}</p>
            <div class="template-meta">
              ${template.tags.map(tag => `<span class="template-tag">${tag}</span>`).join('')}
            </div>
            <div class="template-actions">
              <button class="btn btn-outline btn-sm" onclick="tryTemplate('${template.id}')">
                Essayer
              </button>
              <button class="btn btn-primary btn-sm" onclick="copyTemplate('${template.id}')">
                Copier
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Render all cards
    function renderGrid() {
      grid.innerHTML = templates
        .filter(t => currentFilter === 'all' || t.category === currentFilter)
        .map(renderTemplateCard)
        .join('');
    }

    // Compile preview for a template
    async function compilePreview(template) {
      if (previewCache.has(template.id)) {
        return previewCache.get(template.id);
      }

      try {
        const result = await compile(template.code);
        if (result.success && result.svg_pages.length > 0) {
          previewCache.set(template.id, result.svg_pages[0]);
          return result.svg_pages[0];
        }
      } catch (e) {
        console.error('Preview error:', template.id, e);
      }
      return null;
    }

    // Update preview
    function updatePreview(templateId, svg) {
      const container = document.getElementById(`preview-${templateId}`);
      if (container && svg) {
        container.innerHTML = `<div class="template-preview-page">${svg}</div>`;
      } else if (container) {
        container.innerHTML = `<div class="template-preview-loading"><span style="color: var(--nova-secondary)">Apercu non disponible</span></div>`;
      }
    }

    // Load all previews
    async function loadPreviews() {
      for (const template of templates) {
        if (currentFilter !== 'all' && template.category !== currentFilter) continue;
        const svg = await compilePreview(template);
        updatePreview(template.id, svg);
      }
    }

    // Copy template code
    window.copyTemplate = function(templateId) {
      const template = templates.find(t => t.id === templateId);
      if (template) {
        navigator.clipboard.writeText(template.code).then(() => {
          const btn = event.target;
          const originalText = btn.textContent;
          btn.textContent = 'Copie !';
          setTimeout(() => btn.textContent = originalText, 1500);
        });
      }
    };

    // Try template in demos page
    window.tryTemplate = function(templateId) {
      const template = templates.find(t => t.id === templateId);
      if (template) {
        // Store template data in localStorage
        localStorage.setItem('novatype_template', JSON.stringify({
          id: template.id,
          name: template.name,
          description: template.description,
          code: template.code
        }));
        // Navigate to demos page
        window.location.href = '../demos.html';
      }
    };

    // Filter handlers
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderGrid();
        if (compilerReady) loadPreviews();
      });
    });

    // Initialize
    async function init() {
      renderGrid();

      try {
        await initNovaCompiler();
        compilerReady = true;
        loadPreviews();
      } catch (e) {
        console.error('Compiler init error:', e);
        // Show fallback message in previews
        templates.forEach(t => {
          const container = document.getElementById(`preview-${t.id}`);
          if (container) {
            container.innerHTML = `<div class="template-preview-loading"><span style="color: var(--nova-secondary)">Apercu non disponible</span></div>`;
          }
        });
      }
    }

    init();

    // Make template codes available for demos page
    window.templateCodes = templates.reduce((acc, t) => {
      acc[t.id] = t.code;
      return acc;
    }, {});
  </script>
</body>
</html>
