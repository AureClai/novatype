[workspace]
members = ["crates/*"]
default-members = ["crates/nova-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
rust-version = "1.80"
authors = ["NovaType Contributors"]
edition = "2021"
homepage = "https://aureclai.github.io/novatype"
repository = "https://github.com/AureClai/novatype"
license = "MIT"
categories = ["text-processing", "compilers"]
keywords = ["typst", "novatype", "documents", "typesetting"]

[workspace.dependencies]
# NovaType crates
novatype-core = { path = "crates/nova-core", version = "0.1.0" }
nova-schema = { path = "crates/nova-schema", version = "0.1.0", default-features = false }
nova-cite = { path = "crates/nova-cite", version = "0.1.0" }
nova-plot = { path = "crates/nova-plot", version = "0.1.0" }
novatype-cli = { path = "crates/nova-cli", version = "0.1.0" }
nova-wasm = { path = "crates/nova-wasm", version = "0.1.0" }
nova-font = { path = "crates/nova-font", version = "0.1.0" }
nova-template = { path = "crates/nova-template", version = "0.1.0" }
nova-python = { path = "crates/nova-python", version = "0.1.0" }

# Typst from crates.io
typst = "0.13"
typst-pdf = "0.13"
typst-svg = "0.13"
typst-syntax = "0.13"
typst-assets = "0.13"
comemo = "0.4"
ecow = { version = "0.2", features = ["serde"] }
fontdb = { version = "0.22", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Schema validation
jsonschema = "0.18"

# Citations
hayagriva = "0.9"
reqwest = { version = "0.12", features = ["json"] }

# Plots
svg = "0.17"
csv = "1"

# Font management
dirs = "5"
zip = "0.6"
sha2 = "0.10"
hex = "0.4"
url = "2.5"

# Python integration
walkdir = "2"
regex = "1"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
once_cell = "1"

# Testing
mockall = "0.12"
tempfile = "3.7"
pretty_assertions = "1.0"
assert_cmd = "2.0"
predicates = "3.0"
wiremock = "0.6"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package."novatype-cli"]
strip = true

[workspace.lints.clippy]
all = "warn"
