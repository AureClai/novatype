[template]
name = "ieee-article"
display_name = "IEEE Journal Article"
description = "Template for IEEE journal articles with proper formatting"
version = "1.0.0"
authors = ["NovaType Team"]
category = "article"

[files]
main = "main.typ"
bibliography_style = "ieee.csl"

[metadata_schema]
required = ["title", "authors"]

[metadata_schema.properties.title]
type = "string"
minLength = 1
description = "Article title"

[metadata_schema.properties.authors]
type = "array"
minItems = 1
description = "List of authors"

[metadata_schema.properties.authors.items]
type = "object"
required = ["name"]

[metadata_schema.properties.authors.items.properties.name]
type = "string"
description = "Author name"

[metadata_schema.properties.authors.items.properties.email]
type = "string"
format = "email"
description = "Author email"

[metadata_schema.properties.authors.items.properties.affiliation]
type = "string"
description = "Author affiliation"

[metadata_schema.properties.authors.items.properties.orcid]
type = "string"
pattern = "^\\d{4}-\\d{4}-\\d{4}-\\d{3}[\\dX]$"
description = "ORCID identifier"

[metadata_schema.properties.abstract]
type = "string"
description = "Article abstract"

[metadata_schema.properties.keywords]
type = "array"
items = { type = "string" }
description = "Keywords for indexing"

[metadata_schema.properties.date]
type = "string"
description = "Publication date"

[[options]]
name = "two_column"
label = "Two Column Layout"
description = "Use two-column layout (default for IEEE)"
type = "boolean"
default = true

[[options]]
name = "conference"
label = "Conference Paper"
description = "Format as conference paper instead of journal article"
type = "boolean"
default = false
