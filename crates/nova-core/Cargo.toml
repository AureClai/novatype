[package]
name = "nova-core"
version = "0.1.0"
description = "Core orchestration engine for NovaType document composition"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
nova-schema = { workspace = true, features = ["validation"] }
nova-cite = { workspace = true, optional = true }
nova-plot = { workspace = true, optional = true }

# Typst from crates.io
typst.workspace = true
typst-pdf.workspace = true
typst-svg.workspace = true
typst-syntax.workspace = true
ecow.workspace = true
comemo.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
mockall.workspace = true
tempfile.workspace = true
pretty_assertions.workspace = true

[features]
default = ["citations", "plots"]
citations = ["dep:nova-cite"]
plots = ["dep:nova-plot"]

[lints.clippy]
all = "warn"
